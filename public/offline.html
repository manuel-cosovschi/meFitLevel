<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hunter Gym System — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #070a12;
        color: #e5e9f0;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        border: 1px solid rgba(59, 130, 246, 0.5);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      }
      h1 { font-size: 18px; margin: 4px 0; }
      p { color: #94a3b8; font-size: 14px; max-width: 280px; }
      a { color: #22d3ee; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="badge"></div>
    <h1>Sistema sin conexión</h1>
    <p>No hay red en este momento, pero tus datos están guardados localmente. Reintentá cuando vuelvas a tener conexión.</p>
    <a href="/">Reintentar</a>
  </body>
</html>
